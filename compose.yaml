services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: "${SUB_STORE_IMAGE:-sub-store-backend:local}"
    init: true
    restart: unless-stopped
    env_file: .env
    ports:
      - "${SUB_STORE_BACKEND_BIND_ADDRESS:-127.0.0.1}:${SUB_STORE_BACKEND_PORT:-3000}:3000"
    environment:
      SUB_STORE_BACKEND_API_HOST: "0.0.0.0"
      SUB_STORE_BACKEND_API_PORT: "3000"
      SUB_STORE_DATA_BASE_PATH: "/opt/app/data"
      SUB_STORE_CORS_ALLOWED_ORIGINS: "${SUB_STORE_CORS_ALLOWED_ORIGINS:-*}"
      SUB_STORE_EXTENSION_ADMIN_TOKEN: "${SUB_STORE_EXTENSION_ADMIN_TOKEN:-}"
      SUB_STORE_EXTENSION_ADMIN_TOKEN_HASH: "${SUB_STORE_EXTENSION_ADMIN_TOKEN_HASH:-}"
      SUB_STORE_BACKEND_SYNC_CRON: "${SUB_STORE_BACKEND_SYNC_CRON:-}"
      SUB_STORE_PUSH_SERVICE: "${SUB_STORE_PUSH_SERVICE:-}"
      SUB_STORE_BACKEND_DEFAULT_PROXY: "${SUB_STORE_BACKEND_DEFAULT_PROXY:-}"
      SUB_STORE_BACKEND_DOWNLOAD_CRON: "${SUB_STORE_BACKEND_DOWNLOAD_CRON:-}"
      SUB_STORE_BACKEND_UPLOAD_CRON: "${SUB_STORE_BACKEND_UPLOAD_CRON:-}"
      SUB_STORE_PRODUCE_CRON: "${SUB_STORE_PRODUCE_CRON:-}"
      SUB_STORE_DATA_URL: "${SUB_STORE_DATA_URL:-}"
      SUB_STORE_DATA_URL_POST: "${SUB_STORE_DATA_URL_POST:-}"
      SUB_STORE_FRONTEND_BACKEND_PATH: "${SUB_STORE_FRONTEND_BACKEND_PATH:-}"
      SUB_STORE_BACKEND_PREFIX: "${SUB_STORE_BACKEND_PREFIX:-}"
    volumes:
      - "${SUB_STORE_DATA_PATH:-sub-store-data}:/opt/app/data"

volumes:
  sub-store-data:
